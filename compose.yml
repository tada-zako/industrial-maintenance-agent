services:
  hermes:
    image: nousresearch/hermes-agent:latest
    container_name: production-internship-hermes
    restart: unless-stopped
    command: ["gateway", "run"]
    environment:
      HERMES_HOME: /opt/data
      API_SERVER_ENABLED: "true"
      API_SERVER_HOST: 0.0.0.0
      API_SERVER_PORT: "8642"
      API_SERVER_KEY: ${HERMES_API_KEY:-local-development-only-change-me}
    ports:
      - "127.0.0.1:8642:8642"
    volumes:
      - hermes_data:/opt/data

  neo4j:
    image: neo4j:5-community
    container_name: production-internship-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-local-development-only-change-me}
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  hermes_data:
    name: production-internship-hermes-data
  neo4j_data:
    name: production-internship-neo4j-data
  neo4j_logs:
    name: production-internship-neo4j-logs
