services:
  maintenance-service:
    build:
      context: .
      dockerfile: services/maintenance_service/Dockerfile
    container_name: production-internship-maintenance-service
    restart: unless-stopped
    command:
      - sh
      - -c
      - >-
        uv run python -m services.maintenance_service.app.db.seed &&
        uv run uvicorn services.maintenance_service.app.main:app --host 0.0.0.0 --port 8000
    environment:
      DATABASE_URL: sqlite+aiosqlite:////app/services/maintenance_service/data/maintenance.db
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-local-development-only-change-me}
      MATERIAL_UPLOAD_DIR: /app/services/maintenance_service/data/uploads
      HERMES_API_URL: http://hermes:8642
      HERMES_MCP_URL: http://maintenance-mcp:8001/mcp
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - maintenance_data:/app/services/maintenance_service/data
    depends_on:
      neo4j:
        condition: service_healthy

  maintenance-mcp:
    build:
      context: .
      dockerfile: services/maintenance_service/Dockerfile
    container_name: production-internship-maintenance-mcp
    restart: unless-stopped
    command: ["uv", "run", "python", "-m", "services.maintenance_service.app.mcp_server"]
    environment:
      DATABASE_URL: sqlite+aiosqlite:////app/services/maintenance_service/data/maintenance.db
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-local-development-only-change-me}
      MATERIAL_UPLOAD_DIR: /app/services/maintenance_service/data/uploads
      MCP_HOST: 0.0.0.0
      MCP_PORT: 8001
      MCP_PATH: /mcp
    ports:
      - "127.0.0.1:8001:8001"
    volumes:
      - maintenance_data:/app/services/maintenance_service/data
    depends_on:
      maintenance-service:
        condition: service_started
      neo4j:
        condition: service_healthy

  hermes:
    image: nousresearch/hermes-agent:latest
    container_name: production-internship-hermes
    restart: unless-stopped
    command:
      - sh
      - -c
      - |
        if ! hermes mcp list | grep -q "maintenance"; then
          until printf 'n\ny\n' | hermes mcp add maintenance --url "$$MAINTENANCE_MCP_URL"; do
            sleep 2
          done
        fi
        exec hermes gateway run
    environment:
      HERMES_HOME: /opt/data
      API_SERVER_ENABLED: "true"
      API_SERVER_HOST: 0.0.0.0
      API_SERVER_PORT: "8642"
      API_SERVER_KEY: ${HERMES_API_KEY:-local-development-only-change-me}
      # Hermes API 与 Web Dashboard 是两个不同的 HTTP 服务。
      HERMES_DASHBOARD: "1"
      HERMES_DASHBOARD_HOST: ${HERMES_DASHBOARD_HOST:-0.0.0.0}
      HERMES_DASHBOARD_PORT: "9119"
      # Dashboard 对容器内的非回环监听需要认证；默认值仅用于本地 Demo。
      HERMES_DASHBOARD_BASIC_AUTH_USERNAME: ${HERMES_DASHBOARD_BASIC_AUTH_USERNAME:-demo}
      HERMES_DASHBOARD_BASIC_AUTH_PASSWORD: ${HERMES_DASHBOARD_BASIC_AUTH_PASSWORD:-local-development-only-change-me}
      HERMES_DASHBOARD_BASIC_AUTH_SECRET: ${HERMES_DASHBOARD_BASIC_AUTH_SECRET:-local-development-only-change-me}
      # Hermes 可使用此地址注册 Streamable HTTP MCP 服务。
      MAINTENANCE_MCP_URL: ${HERMES_MCP_URL:-http://maintenance-mcp:8001/mcp}
    ports:
      - "127.0.0.1:8642:8642"
      - "127.0.0.1:9119:9119"
    volumes:
      - hermes_data:/opt/data
      # 用项目内受控 Skill 覆盖持久卷中的旧降级指令，禁止 Agent 写本地维修文件。
      - ./hermes/skills/industrial-maintenance:/opt/data/skills/mlops/mcp-maintenance:ro
    depends_on:
      maintenance-mcp:
        condition: service_started

  neo4j:
    image: neo4j:5-community
    container_name: production-internship-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-local-development-only-change-me}
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://127.0.0.1:8000}
        VITE_HERMES_WEB_URL: ${VITE_HERMES_WEB_URL:-http://127.0.0.1:9119}
        VITE_USE_MOCK: ${VITE_USE_MOCK:-false}
    container_name: production-internship-maintenance-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:80"
    depends_on:
      maintenance-service:
        condition: service_started

volumes:
  maintenance_data:
    name: production-internship-maintenance-data
  hermes_data:
    name: production-internship-hermes-data
  neo4j_data:
    name: production-internship-neo4j-data
  neo4j_logs:
    name: production-internship-neo4j-logs
